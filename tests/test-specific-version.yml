name: Test specific Az version from pre-staged folder
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
      POWERSHELL_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure pwsh is available
        run: |
          set -e
          SUDO=""; if [ "$(id -u)" -ne 0 ]; then SUDO="sudo"; fi
          if ! command -v pwsh >/dev/null 2>&1; then
            case "$(uname -m)" in
              x86_64) A=x64 ;;
              aarch64|arm64) A=arm64 ;;
              *) echo "unsupported arch"; exit 1 ;;
            esac
            V=7.4.6
            curl -fsSL -o /tmp/pwsh.tgz "https://github.com/PowerShell/PowerShell/releases/download/v${V}/powershell-${V}-linux-${A}.tar.gz"
            $SUDO mkdir -p /opt/microsoft/powershell/7
            $SUDO tar -xzf /tmp/pwsh.tgz -C /opt/microsoft/powershell/7
            $SUDO chmod +x /opt/microsoft/powershell/7/pwsh
            $SUDO ln -sf /opt/microsoft/powershell/7/pwsh /usr/local/bin/pwsh
          fi
          pwsh -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
      - name: Pre-stage stand-in Az 99.0.0 where the action looks for it (hosted-agent layout)
        run: |
          set -e
          # Mirror the action's default install folder resolution for linux
          if [ -d /usr/share ] && [ -w /usr/share ]; then
            ROOT=/usr/share
          elif [ -n "$RUNNER_TOOL_CACHE" ] && [ -d "$RUNNER_TOOL_CACHE" ] && [ -w "$RUNNER_TOOL_CACHE" ]; then
            ROOT="$RUNNER_TOOL_CACHE"
          else
            ROOT="$GITHUB_WORKSPACE"
          fi
          echo "module root: $ROOT"
          D="$ROOT/az_99.0.0/Az/99.0.0"
          mkdir -p "$D"
          printf "function Get-FakeAzMarker { 'fake-az-99' }\nExport-ModuleMember -Function Get-FakeAzMarker\n" > "$D/Az.psm1"
          pwsh -NoLogo -NoProfile -Command "New-ModuleManifest -Path '$D/Az.psd1' -ModuleVersion '99.0.0' -RootModule 'Az.psm1'"
          rm -f /tmp/azps-version.txt
      - id: action
        uses: .
        with:
          azPSVersion: "99.0.0"
          inlineScript: |
            Import-Module Az -RequiredVersion 99.0.0
            $m = Get-Module Az
            Set-Content -Path /tmp/azps-version.txt -Value "$($m.Version.ToString()) $(Get-FakeAzMarker)"
      - name: Assert the requested module version was used
        run: |
          if [ ! -f /tmp/azps-version.txt ]; then
            echo "FAIL: marker file not written (module import failed?)"
            exit 1
          fi
          CONTENT="$(cat /tmp/azps-version.txt)"
          echo "content: $CONTENT"
          if [ "$CONTENT" != "99.0.0 fake-az-99" ]; then
            echo "FAIL: expected '99.0.0 fake-az-99'"
            exit 1
          fi
          echo "PASS"
