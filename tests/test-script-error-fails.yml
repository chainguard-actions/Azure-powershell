name: Test script error with failOnStandardError fails the step
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up pwsh and fake Az module
        run: bash "$GITHUB_WORKSPACE/tests/fixtures/setup-pwsh.sh"
      - id: action
        uses: .
        continue-on-error: true
        with:
          azPSVersion: latest
          failOnStandardError: 'true'
          inlineScript: |
            Write-Error "intentional failure"
            Set-Content -Path (Join-Path $env:RUNNER_TEMP "azps-after-error.txt") -Value "ran"
      - name: Assert action failed and stopped at the error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when script writes an error with Stop preference"
            exit 1
          fi
          if [ -f "$RUNNER_TEMP/azps-after-error.txt" ]; then
            echo "FAIL: script continued past error despite ErrorActionPreference=Stop"
            exit 1
          fi
          echo "PASS"
