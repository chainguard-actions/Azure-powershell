name: Test invalid errorActionPreference is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare
        run: rm -f /tmp/azps-invalid.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          azPSVersion: latest
          errorActionPreference: bogus
          inlineScript: |
            Set-Content -Path /tmp/azps-invalid.txt -Value "should-not-run"
      - name: Assert step failed validation and script did not run
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid errorActionPreference"
            exit 1
          fi
          if [ -f /tmp/azps-invalid.txt ]; then
            echo "FAIL: inline script ran despite invalid input"
            exit 1
          fi
          echo "PASS"
